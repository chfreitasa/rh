<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#183482">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gestão de Férias - Regional Nordeste | Alupar</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            /* PALETA OFICIAL ALUPAR */
            --alupar-blue: #183482;
            --alupar-blue-dark: #0f2359;
            --alupar-blue-light: #e8eef7;
            --alupar-green: #2ea843;
            --alupar-green-dark: #217d31;
            --alupar-green-light: #eaf7ec;
            
            --bg-page: #f0f4f9;
            --text: #2c3e50;
            --error: #d32f2f;
            --warning: #f57c00;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #e4ebf5 0%, #f4f7fb 100%);
            color: var(--text);
            margin: 0;
            padding: 0 0 40px 0;
            min-height: 100vh;
        }

        /* BARRA SUPERIOR INSTITUCIONAL ALUPAR */
        .alupar-topbar {
            background-color: var(--alupar-blue);
            border-bottom: 4px solid var(--alupar-green);
            padding: calc(14px + var(--safe-top)) 24px 14px;
            box-shadow: 0 4px 15px rgba(24, 52, 130, 0.2);
            margin-bottom: 28px;
        }
        .topbar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .brand-group {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        /* REPRODUÇÃO EM CSS DA LOGO ALUPAR */
        .alupar-logo {
            display: inline-flex;
            align-items: baseline;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            font-weight: 800;
            font-size: 2em;
            color: #ffffff;
            letter-spacing: -0.8px;
            line-height: 1;
            user-select: none;
            padding-top: 6px;
        }
        .alupar-logo .upar-bar {
            position: relative;
            display: inline-block;
        }
        .alupar-logo .upar-bar::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 1px;
            right: 0;
            height: 5px;
            background-color: var(--alupar-green);
            border-radius: 1px;
        }

        .brand-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.25);
        }
        .page-title {
            color: #ffffff;
            margin: 0;
            font-size: 1.25em;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .btn-logout {
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-logout:hover { background: var(--error); border-color: var(--error); }
        .btn-logout:active { transform: scale(0.96); }

        .app-container { max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 15px; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        
        /* LOGIN */
        .login-wrapper { padding: 40px 15px; }
        .login-container {
            background: #fff;
            max-width: 400px;
            margin: 20px auto 0;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(24, 52, 130, 0.15);
            width: 100%;
            overflow: hidden;
        }
        .login-banner {
            background: var(--alupar-blue);
            border-bottom: 4px solid var(--alupar-green);
            padding: 28px 20px;
            text-align: center;
        }
        .login-banner p {
            color: rgba(255,255,255,0.85);
            margin: 10px 0 0;
            font-size: 0.9em;
            font-weight: 500;
        }
        .login-body { padding: 30px; }
        .login-body h2 { text-align: center; color: var(--alupar-blue); margin-top: 0; margin-bottom: 22px; font-size: 1.35em; }

        /* FORMULÁRIOS GLOBAIS */
        .container-box {
            background: #fff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(24, 52, 130, 0.08);
            border-top: 4px solid var(--alupar-blue);
            margin-bottom: 28px;
        }
        .form-title { margin-top: 0; margin-bottom: 18px; color: var(--alupar-blue); font-size: 1.2em; text-align: center; font-weight: 700; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9em; color: #4a5568; }
        input[type="text"], input[type="password"], input[type="number"], input[type="date"], select {
            flex: 1; height: 48px; margin: 0; padding: 0 12px; border: 1.5px solid #cbd5e1; border-radius: 9px;
            font-size: 1em; background-color: #f8fafc; font-family: inherit; color: var(--text); width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--alupar-blue);
            box-shadow: 0 0 0 3px rgba(24, 52, 130, 0.12);
            background-color: #fff;
        }
        button.main-btn {
            display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; height: 52px;
            margin-top: 10px; background-color: var(--alupar-green); color: white; border: none; border-radius: 9px;
            font-size: 1.1em; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 var(--alupar-green-dark);
            transition: background-color 0.2s, transform 0.1s;
        }
        button.main-btn:hover { background-color: #28943b; }
        button.main-btn:active { transform: translateY(4px); box-shadow: none; }
        button.main-btn:disabled { background-color: #94a3b8; box-shadow: none; cursor: not-allowed; }
        button.main-btn.btn-edit-mode { background-color: var(--warning); box-shadow: 0 4px 0 #c66900; }
        .btn-cancel {
            display: none; width: 100%; margin-top: 10px; padding: 12px; background-color: #fff;
            color: var(--error); border: 2px solid var(--error); border-radius: 9px; font-size: 1em;
            font-weight: bold; cursor: pointer;
        }
        .btn-cancel:active { background-color: var(--error); color: #fff; }
        .error-msg { color: var(--error); font-size: 0.9em; text-align: center; margin-top: 10px; min-height: 20px; font-weight: 600; }

        /* BARRA DE EXPORTAÇÃO E IMPRESSÃO */
        .export-toolbar {
            display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap;
            margin-top: 20px; padding-top: 18px; border-top: 1px solid #e2e8f0;
        }
        .btn-export {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 18px; border-radius: 8px; font-weight: bold; font-size: 0.95em;
            cursor: pointer; border: none; transition: 0.2s; color: #fff; flex: 1; min-width: 180px;
        }
        .btn-export.csv { background-color: var(--alupar-green); box-shadow: 0 3px 0 var(--alupar-green-dark); }
        .btn-export.csv:active { transform: translateY(3px); box-shadow: none; }
        .btn-export.print { background-color: var(--alupar-blue); box-shadow: 0 3px 0 var(--alupar-blue-dark); }
        .btn-export.print:active { transform: translateY(3px); box-shadow: none; }

        /* GRADE DO FORMULÁRIO DE FÉRIAS (5 CAMPOS) */
        .ferias-form-grid {
            display: grid;
            grid-template-columns: 2fr 1.4fr 1.1fr 0.8fr 1.3fr;
            gap: 12px;
            align-items: end;
        }

        /* LISTAGEM E ETIQUETAS (BADGES) */
        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; padding: 12px 15px; margin-bottom: 8px;
            border-radius: 8px; border: 1px solid #e2e8f0; border-left: 5px solid var(--alupar-green);
            transition: 0.2s;
        }
        .list-item:hover { background: #f1f5f9; }
        .list-item.editing { border-left-color: var(--warning); background: #fff8e1; }
        .colab-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
        .colab-header strong { color: var(--alupar-blue); font-size: 1.02em; }
        .badge-meta {
            display: inline-block; padding: 2px 8px; border-radius: 5px;
            font-size: 0.73em; font-weight: 700; letter-spacing: 0.4px;
        }
        .badge-setor { background: var(--alupar-green-light); color: var(--alupar-green-dark); border: 1px solid #b7e4c0; }
        .badge-se { background: var(--alupar-blue-light); color: var(--alupar-blue); border: 1px solid #c5d4eb; }

        .item-actions { display: flex; gap: 8px; align-items: center; }
        .btn-icon {
            border: none; width: 38px; height: 38px; border-radius: 8px;
            font-weight: bold; font-size: 1.15em; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: transform 0.15s, background-color 0.15s;
        }
        .btn-icon.edit { background: #fff3e0; color: var(--warning); border: 1px solid #ffe0b2; }
        .btn-icon.edit:active { background: var(--warning); color: #fff; transform: scale(0.94); }
        .btn-icon.delete { background: #ffebee; color: var(--error); border: 1px solid #ffcdd2; font-size: 1.25em; }
        .btn-icon.delete:active { background: var(--error); color: #fff; transform: scale(0.94); }

        /* BARRA DE FILTROS DO CALENDÁRIO */
        .filter-bar-container {
            display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap;
            margin-bottom: 25px; background: #fff; padding: 15px 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(24, 52, 130, 0.06);
            border: 1px solid #e2e8f0;
        }
        .filter-item { display: flex; align-items: center; gap: 8px; }
        .filter-item label { margin: 0; white-space: nowrap; font-size: 0.9em; color: var(--alupar-blue); font-weight: 700; }
        .filter-item select { height: 42px; min-width: 145px; font-weight: 600; font-size: 0.95em; padding: 0 10px; }

        /* CALENDÁRIOS COM IDENTIDADE ALUPAR */
        .calendars-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
        .calendar-box {
            border: 1px solid #d8e2ef; border-radius: 12px; overflow: hidden;
            background: #fff; width: 100%; box-shadow: 0 4px 12px rgba(24, 52, 130, 0.05);
        }
        .calendar-header {
            background: var(--alupar-blue);
            border-bottom: 3px solid var(--alupar-green);
            color: #fff; text-align: center; padding: 10px;
            font-weight: bold; font-size: 1.05em; letter-spacing: 0.3px;
        }
        .calendar-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 0.8em; width: 100%; }
        .day-name { background: #f1f5f9; padding: 8px 0; font-weight: 700; color: var(--alupar-blue); min-width: 0; border-bottom: 1px solid #e2e8f0; }
        .day-cell { border: 0.5px solid #edf2f7; min-height: 60px; min-width: 0; overflow: hidden; padding: 3px 2px; font-size: 0.85em; display: flex; flex-direction: column; align-items: center; }
        .day-num { font-weight: 700; margin-bottom: 2px; color: #334155; }
        .day-cell.has-vacation { background-color: var(--alupar-green-light); }
        .day-cell.overlap { background-color: #ffebee; border-color: #ffcdd2; }
        .vacation-tag {
            font-size: 0.62em; background: var(--alupar-green); color: white;
            padding: 1px 2px; border-radius: 3px; margin-top: 2px; width: 100%; max-width: 100%;
            text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: block; font-weight: 600;
        }
        .day-cell.overlap .vacation-tag { background: var(--error); }

        @media (max-width: 900px) {
            .ferias-form-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 600px) {
            .alupar-topbar { padding: calc(12px + var(--safe-top)) 15px 12px; }
            .brand-divider { display: none; }
            .page-title { font-size: 1.05em; width: 100%; }
            .ferias-form-grid { grid-template-columns: 1fr; }
            .filter-bar-container { flex-direction: column; align-items: stretch; gap: 10px; }
            .filter-item { justify-content: space-between; }
            .filter-item select { flex: 1; }
            .day-cell { min-height: 52px; font-size: 0.75em; }
            .export-toolbar { flex-direction: column; }
        }

        /* ESTILOS DE IMPRESSÃO / PDF */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: #fff !important; padding: 0 !important; display: block !important; }
            .app-container { max-width: 100% !important; width: 100% !important; }
            #page-login, .btn-logout, #blocoInputsFerias, .item-actions, .export-toolbar { display: none !important; }
            .alupar-topbar { margin-bottom: 15px !important; padding: 10px 20px !important; }
            .container-box { box-shadow: none !important; border: 1px solid #ccc !important; padding: 15px !important; margin-bottom: 20px !important; }
            .filter-bar-container { box-shadow: none !important; border: 1px solid #eee !important; padding: 8px !important; margin-bottom: 15px !important; }
            .filter-item select { border: none !important; background: transparent !important; appearance: none; -webkit-appearance: none; font-weight: bold; padding: 0; }
            .calendars-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 12px !important; }
            .calendar-box { break-inside: avoid; page-break-inside: avoid; }
            .day-cell { min-height: 45px !important; }
            .list-item { break-inside: avoid; page-break-inside: avoid; border: 1px solid #eee; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="page-login" class="page">
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-banner">
                <div class="alupar-logo">Al<span class="upar-bar">upar</span></div>
                <p>Gestão de Férias - Regional Nordeste</p>
            </div>
            <div class="login-body">
                <h2>🔒 Acesso Restrito</h2>
                <div class="form-group"><label>Usuário</label><input type="text" id="loginUser" placeholder="Digite seu usuário" autocomplete="username"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="loginPass" placeholder="Digite sua senha" autocomplete="current-password"></div>
                <div class="error-msg" id="loginError"></div>
                <button class="main-btn" id="btnLogin" onclick="fazerLogin()">Entrar no Sistema</button>
            </div>
        </div>
    </div>
</div>

<!-- TELA PRINCIPAL: GESTÃO DE FÉRIAS -->
<div id="page-ferias" class="page">
    <!-- CABEÇALHO OFICIAL ALUPAR -->
    <header class="alupar-topbar">
        <div class="topbar-content">
            <div class="brand-group">
                <div class="alupar-logo">Al<span class="upar-bar">upar</span></div>
                <div class="brand-divider"></div>
                <h1 class="page-title">Gestão de Férias - Regional Nordeste</h1>
            </div>
            <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
        </div>
    </header>

    <div class="app-container">
        <div class="container-box" id="boxFormFerias">
            <div id="blocoInputsFerias">
                <h2 class="form-title" id="tituloFormFerias">Cadastrar Período de Férias</h2>
                <div class="ferias-form-grid">
                    <div class="form-group" style="margin:0">
                        <label>Colaborador</label>
                        <input type="text" id="fColab" placeholder="Nome do colaborador">
                    </div>
                    <div class="form-group" style="margin:0">
                        <label>Setor / Equipe</label>
                        <select id="fSetor">
                            <option value="TELECOM">TELECOM</option>
                            <option value="SPCS">SPCS</option>
                            <option value="OPERAÇÃO">OPERAÇÃO</option>
                            <option value="EAT">EAT</option>
                            <option value="LT">LT</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin:0">
                        <label>Subestação</label>
                        <select id="fSubestacao">
                            <option value="SE JZT">SE JZT</option>
                            <option value="SE GOR">SE GOR</option>
                            <option value="SE OUR">SE OUR</option>
                            <option value="SE BJD">SE BJD</option>
                            <option value="SE SDS">SE SDS</option>
                            <option value="SE RDE">SE RDE</option>
                            <option value="SE RGD">SE RGD</option>
                            <option value="SE JCT">SE JCT</option>
                            <option value="SE JCD">SE JCD</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin:0">
                        <label>Dias</label>
                        <input type="number" id="fDias" min="1" max="30" placeholder="Ex: 15">
                    </div>
                    <div class="form-group" style="margin:0">
                        <label>Início</label>
                        <input type="date" id="fInicio" value="2026-01-05">
                    </div>
                </div>
                <div class="error-msg" id="errorMsgFerias"></div>
                <button class="main-btn" id="btnSalvarFerias" style="margin-top:15px;" onclick="salvarFerias()">Adicionar Férias</button>
                <button class="btn-cancel" id="btnCancelarFerias" onclick="cancelarEdicaoFerias()">Cancelar Edição</button>
            </div>
            
            <div id="listaFerias" style="margin-top: 25px;"></div>

            <div class="export-toolbar">
                <button class="btn-export csv" onclick="exportarCSV()">📊 Exportar Excel (CSV)</button>
                <button class="btn-export print" onclick="imprimirRelatorio()">🖨️ Imprimir / Salvar PDF</button>
            </div>
        </div>

        <div class="filter-bar-container">
            <div class="filter-item">
                <label for="anoSelecionado">📅 Ano:</label>
                <select id="anoSelecionado" onchange="renderFerias()">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="filtroSetor">🛠️ Setor:</label>
                <select id="filtroSetor" onchange="renderFerias()">
                    <option value="TODOS">Todos os Setores</option>
                    <option value="TELECOM">TELECOM</option>
                    <option value="SPCS">SPCS</option>
                    <option value="OPERAÇÃO">OPERAÇÃO</option>
                    <option value="EAT">EAT</option>
                    <option value="LT">LT</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="filtroSubestacao">⚡ Subestação:</label>
                <select id="filtroSubestacao" onchange="renderFerias()">
                    <option value="TODAS">Todas as SEs</option>
                    <option value="SE JZT">SE JZT</option>
                    <option value="SE GOR">SE GOR</option>
                    <option value="SE OUR">SE OUR</option>
                    <option value="SE BJD">SE BJD</option>
                    <option value="SE SDS">SE SDS</option>
                    <option value="SE RDE">SE RDE</option>
                    <option value="SE RGD">SE RGD</option>
                    <option value="SE JCT">SE JCT</option>
                    <option value="SE JCD">SE JCD</option>
                </select>
            </div>
        </div>

        <div class="calendars-grid" id="calendariosContainer"></div>
    </div>
</div>

<script>
    // ==========================================
    // BANCO DE DADOS (SINCRONIZAÇÃO SEGURA)
    // ==========================================
    const BIN_ID = '6a7dd104da38895dfedfe24d'; 
    const API_KEY = '$2a$10$KMiP/Zy1E5f0NzxO2r4tcu24duXEofxlQ6S5ON2H0iJdaerfpjk86';
    const URL_DB = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    let dbCache = { ferias: [] };
    let dbCarregado = false;

    function normalizarRegistro(f) {
        let setor = (f.setor || '').toUpperCase().trim();
        if (setor === 'TELECOMUNICAÇÕES' || setor === 'TELECOMUNICACOES') setor = 'TELECOM';
        
        let se = (f.subestacao || '').toUpperCase().trim();
        if (se === 'SE BJL' || se === 'BJL' || se === 'BJD') se = 'SE BJD';

        return {
            ...f,
            setor: setor || f.setor,
            subestacao: se || f.subestacao
        };
    }

    async function getDB() {
        try {
            const res = await fetch(`${URL_DB}/latest`, {
                headers: { 
                    'X-Master-Key': API_KEY,
                    'Cache-Control': 'no-cache'
                }
            });
            if (!res.ok) throw new Error(`Status HTTP: ${res.status}`);
            
            const json = await res.json();
            if (json.record && typeof json.record === 'object') {
                dbCache = {
                    ...json.record,
                    ferias: Array.isArray(json.record.ferias) ? json.record.ferias.map(normalizarRegistro) : []
                };
                dbCarregado = true;
            }
            return dbCache;
        } catch (e) {
            console.error("Erro ao buscar banco:", e);
            alert("Atenção: Não foi possível carregar os dados do servidor. Verifique sua conexão antes de fazer alterações.");
            return dbCache;
        }
    }

    async function saveDB() {
        if (!dbCarregado) {
            alert("Sincronização pendente: o banco ainda não foi carregado do servidor. A gravação foi bloqueada para evitar perda de dados.");
            return false;
        }

        document.querySelectorAll('.main-btn').forEach(b => b.disabled = true);
        try {
            const res = await fetch(URL_DB, { 
                method: 'PUT', 
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-Master-Key': API_KEY,
                    'X-Bin-Versioning': 'false'
                }, 
                body: JSON.stringify(dbCache) 
            });
            if (!res.ok) throw new Error(`Erro ao salvar: ${res.status}`);
            return true;
        } catch (e) { 
            console.error("Erro na gravação:", e);
            alert("Erro de conexão ao salvar os dados na nuvem."); 
            return false;
        } finally { 
            document.querySelectorAll('.main-btn').forEach(b => b.disabled = false); 
        }
    }

    // ==========================================
    // LOGIN & NAVEGAÇÃO
    // ==========================================
    function isLoggedIn() { return sessionStorage.getItem('etb_logged') === 'true'; }
    
    async function fazerLogin() {
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();
        const e = document.getElementById('loginError');
        const btn = document.getElementById('btnLogin');

        if (u === 'alupar' && p === 'nordeste') { 
            sessionStorage.setItem('etb_logged', 'true'); 
            e.style.opacity = '0'; 
            btn.disabled = true;
            btn.innerText = 'Sincronizando banco...';
            await getDB();
            btn.disabled = false;
            btn.innerText = 'Entrar no Sistema';
            location.hash = '#ferias'; 
        } else { 
            e.innerText = 'Usuário ou senha incorretos.'; 
            e.style.opacity = '1'; 
            setTimeout(() => e.style.opacity = '0', 3000); 
        }
    }

    function fazerLogout() { 
        sessionStorage.removeItem('etb_logged'); 
        dbCarregado = false;
        cancelarEdicaoFerias();
        location.hash = '#login'; 
    }

    document.addEventListener('keydown', e => { 
        if (e.key === 'Enter' && (!isLoggedIn() || location.hash === '#login')) fazerLogin(); 
    });

    async function navigate() {
        if (!isLoggedIn()) { 
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-login').classList.add('active');
            if (location.hash !== '#login') location.hash = '#login';
            return; 
        }

        if (!dbCarregado) {
            await getDB();
        }

        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-ferias').classList.add('active');
        if (location.hash !== '#ferias') location.hash = '#ferias';
        renderFerias();
    }

    window.addEventListener('hashchange', navigate);
    window.addEventListener('load', navigate);

    // ==========================================
    // GESTÃO DE FÉRIAS (CADASTRO E EDIÇÃO)
    // ==========================================
    const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const DIAS_SEMANA = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    let editandoFeriasId = null;
    
    function showErrorFerias(msg) { 
        const el = document.getElementById('errorMsgFerias'); 
        el.innerText = msg; 
        el.style.opacity = '1'; 
        setTimeout(() => el.style.opacity = '0', 3000); 
    }

    function extrairDataInput(f) {
        if (f.inicioIso) return f.inicioIso;
        if (f.inicioStr && f.inicioStr.includes('/')) {
            const [dia, mes, ano] = f.inicioStr.split('/');
            return `${ano}-${mes.padStart(2, '0')}-${dia.padStart(2, '0')}`;
        }
        const d = new Date(f.inicioTimestamp);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function obterListaFiltrada() {
        const setorSel = document.getElementById('filtroSetor').value;
        const seSel = document.getElementById('filtroSubestacao').value;

        return dbCache.ferias.filter(f => {
            const matchSetor = setorSel === 'TODOS' || (f.setor || 'NÃO INFORMADO') === setorSel;
            const matchSE = seSel === 'TODAS' || (f.subestacao || 'NÃO INFORMADA') === seSel;
            return matchSetor && matchSE;
        });
    }
    
    async function salvarFerias() {
        let n = document.getElementById('fColab').value.trim(),
            setor = document.getElementById('fSetor').value,
            subestacao = document.getElementById('fSubestacao').value,
            d = parseInt(document.getElementById('fDias').value),
            i = document.getElementById('fInicio').value;
        if (!n || !setor || !subestacao || !d || !i) return showErrorFerias("Preencha todos os campos.");
        if (d < 1 || d > 30) return showErrorFerias("O período deve ser entre 1 e 30 dias.");
        
        let idDate = new Date(i + "T00:00:00"), fdDate = new Date(idDate);
        fdDate.setDate(fdDate.getDate() + d - 1);

        let dadosFerias = {
            nome: n,
            setor: setor,
            subestacao: subestacao,
            dias: d,
            inicioIso: i,
            inicioStr: idDate.toLocaleDateString('pt-BR'),
            fimStr: fdDate.toLocaleDateString('pt-BR'),
            inicioTimestamp: idDate.getTime(),
            fimTimestamp: fdDate.getTime()
        };

        if (editandoFeriasId !== null) {
            let idx = dbCache.ferias.findIndex(f => f.id === editandoFeriasId);
            if (idx !== -1) {
                dbCache.ferias[idx] = { ...dbCache.ferias[idx], ...dadosFerias };
            }
            limparFormularioFerias();
        } else {
            dbCache.ferias.push({
                id: Date.now(),
                ...dadosFerias
            });
            document.getElementById('fColab').value = '';
            document.getElementById('fDias').value = '';
        }
        
        await saveDB();
        renderFerias();
    }

    function editarFerias(id) {
        const f = dbCache.ferias.find(item => item.id === id);
        if (!f) return;

        editandoFeriasId = id;
        document.getElementById('fColab').value = f.nome;
        if (f.setor) document.getElementById('fSetor').value = f.setor;
        if (f.subestacao) document.getElementById('fSubestacao').value = f.subestacao;
        document.getElementById('fDias').value = f.dias;
        document.getElementById('fInicio').value = extrairDataInput(f);

        document.getElementById('tituloFormFerias').innerText = "Editando Período de Férias";
        const btnSalvar = document.getElementById('btnSalvarFerias');
        btnSalvar.innerText = "Salvar Alterações";
        btnSalvar.classList.add('btn-edit-mode');
        document.getElementById('btnCancelarFerias').style.display = 'block';

        renderFerias();
        document.getElementById('boxFormFerias').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelarEdicaoFerias() {
        limparFormularioFerias();
        renderFerias();
    }

    function limparFormularioFerias() {
        editandoFeriasId = null;
        document.getElementById('fColab').value = '';
        document.getElementById('fDias').value = '';
        document.getElementById('tituloFormFerias').innerText = "Cadastrar Período de Férias";
        const btnSalvar = document.getElementById('btnSalvarFerias');
        btnSalvar.innerText = "Adicionar Férias";
        btnSalvar.classList.remove('btn-edit-mode');
        document.getElementById('btnCancelarFerias').style.display = 'none';
    }

    async function removerFerias(id) {
        if (!confirm("Remover este período de férias?")) return;
        if (editandoFeriasId === id) limparFormularioFerias();
        dbCache.ferias = dbCache.ferias.filter(f => f.id !== id);
        await saveDB();
        renderFerias();
    }

    // ==========================================
    // EXPORTAÇÃO (CSV / EXCEL) E IMPRESSÃO (PDF)
    // ==========================================
    function verificarConflito(registroAtual, listaCompleta) {
        const conflitantes = listaCompleta.filter(outro => 
            outro.id !== registroAtual.id &&
            registroAtual.inicioTimestamp <= outro.fimTimestamp &&
            registroAtual.fimTimestamp >= outro.inicioTimestamp
        );
        if (conflitantes.length === 0) return "Sem conflito";
        return "Conflito com: " + conflitantes.map(c => `${c.nome} (${c.setor || 'S/S'} - ${c.subestacao || 'S/SE'})`).join(", ");
    }

    function exportarCSV() {
        const listaParaExportar = obterListaFiltrada();
        if (!listaParaExportar || listaParaExportar.length === 0) {
            return showErrorFerias("Não há registros de férias no filtro atual para exportar.");
        }

        const listaOrdenada = [...listaParaExportar].sort((a, b) => a.inicioTimestamp - b.inicioTimestamp);
        let csvContent = "\uFEFFColaborador;Setor;Subestação;Dias;Data de Início;Data de Término;Ano de Início;Status de Conflito\n";

        listaOrdenada.forEach(f => {
            const nomeLimpo = `"${(f.nome || '').replace(/"/g, '""')}"`;
            const setorLimpo = `"${(f.setor || 'NÃO INFORMADO').replace(/"/g, '""')}"`;
            const seLimpa = `"${(f.subestacao || 'NÃO INFORMADA').replace(/"/g, '""')}"`;
            const anoInicio = new Date(f.inicioTimestamp).getFullYear();
            const statusConflito = `"${verificarConflito(f, listaOrdenada)}"`;
            
            csvContent += `${nomeLimpo};${setorLimpo};${seLimpa};${f.dias};${f.inicioStr};${f.fimStr};${anoInicio};${statusConflito}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const anoRef = document.getElementById('anoSelecionado').value;
        
        link.setAttribute('href', url);
        link.setAttribute('download', `ferias_regional_nordeste_${anoRef}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function imprimirRelatorio() {
        window.print();
    }

    // ==========================================
    // RENDERIZAÇÃO NA TELA
    // ==========================================
    function renderFerias() {
        let ld = document.getElementById('listaFerias');
        ld.innerHTML = '';
        
        const listaFiltrada = obterListaFiltrada();

        if (!listaFiltrada.length) {
            ld.innerHTML = '<p style="color:#94a3b8;text-align:center">Nenhuma féria encontrada para os filtros selecionados.</p>';
        } else {
            listaFiltrada.sort((a, b) => a.inicioTimestamp - b.inicioTimestamp).forEach(f => {
                const isEditing = f.id === editandoFeriasId ? 'editing' : '';
                const setorTxt = f.setor || 'SEM SETOR';
                const seTxt = f.subestacao || 'SEM SE';
                
                ld.innerHTML += `
                    <div class="list-item ${isEditing}">
                        <div>
                            <div class="colab-header">
                                <strong>${f.nome}</strong>
                                <span class="badge-meta badge-setor">${setorTxt}</span>
                                <span class="badge-meta badge-se">${seTxt}</span>
                            </div>
                            <small>${f.inicioStr} até ${f.fimStr} <strong>(${f.dias} dias)</strong></small>
                        </div>
                        <div class="item-actions">
                            <button class="btn-icon edit" onclick="editarFerias(${f.id})" title="Editar">✏️</button>
                            <button class="btn-icon delete" onclick="removerFerias(${f.id})" title="Excluir">✖</button>
                        </div>
                    </div>`;
            });
        }
        let c = document.getElementById('calendariosContainer');
        c.innerHTML = '';
        gerarAno(parseInt(document.getElementById('anoSelecionado').value), listaFiltrada, c);
    }

    function gerarAno(ano, ferias, container) {
        for (let m = 0; m < 12; m++) {
            let box = document.createElement('div');
            box.className = 'calendar-box';
            box.innerHTML = `<div class="calendar-header">${MESES[m]} ${ano}</div>`;
            let g = document.createElement('div');
            g.className = 'calendar-days';
            DIAS_SEMANA.forEach(d => g.innerHTML += `<div class="day-name">${d}</div>`);
            
            let pds = new Date(ano, m, 1).getDay();
            for (let i = 0; i < pds; i++) g.innerHTML += '<div class="day-cell"></div>';
            
            let qtd = new Date(ano, m + 1, 0).getDate();
            for (let d = 1; d <= qtd; d++) {
                let dt = new Date(ano, m, d).getTime(),
                    ef = ferias.filter(f => dt >= f.inicioTimestamp && dt <= f.fimTimestamp),
                    cc = 'day-cell';
                if (ef.length > 0) cc += ef.length > 1 ? ' overlap' : ' has-vacation';
                let th = ef.map(f => {
                    const infoTooltip = `${f.nome} | ${f.setor || 'S/S'} | ${f.subestacao || 'S/SE'}`;
                    return `<div class="vacation-tag" title="${infoTooltip}">${f.nome.split(' ')[0]}</div>`;
                }).join('');
                g.innerHTML += `<div class="${cc}"><div class="day-num">${d}</div>${th}</div>`;
            }
            box.appendChild(g);
            container.appendChild(box);
        }
    }
</script>
